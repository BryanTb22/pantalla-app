name: APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: |
          mkdir -p android/app/src/main/res/mipmap
          cp icon-192.png android/app/src/main/res/mipmap/ic_launcher.png
          cd android
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Pantalla.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: Pantalla APK
          files: Pantalla.apk
          make_latest: true
