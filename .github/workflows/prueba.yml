name: Prueba en emulador
on:
  push:
    branches: [main]
    paths-ignore: ['pc/**', '.github/workflows/pc.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK de prueba
        run: cd android && gradle assembleDebug --no-daemon
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probar en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash .github/prueba.sh
      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: prueba
          name: Resultados de prueba
          prerelease: true
          files: |
            prueba-log.txt
            prueba-panel.png
            prueba-panel2.png
            prueba-panel3.png
            prueba-visor.png
